<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maham & Harris — One Photo a Day</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --maham: #ff7fac;
    --maham-deep: #e0568a;
    --maham-bg: #ffe1ec;
    --maham-bg-soft: #fff0f5;
    --harris: #57b8ff;
    --harris-deep: #2f95e0;
    --harris-bg: #dcf1ff;
    --harris-bg-soft: #eef9ff;
    --card: #fffdfa;
    --ink: #4a3b45;
    --ink-soft: #9385a0;
    --cream: #fffaf6;
    --border: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: linear-gradient(to right, var(--maham-bg-soft) 50%, var(--harris-bg-soft) 50%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Quicksand', sans-serif;
  }
  h1, h2, h3, .display {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    letter-spacing: 0;
  }
  .mono { font-family: 'Nunito', sans-serif; font-weight: 700; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- GATE ---------- */
  #gate {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .gate-card {
    max-width: 440px; width: 100%;
    background: var(--card); color: var(--ink);
    border-radius: 32px; padding: 40px 36px;
    box-shadow: 0 20px 45px rgba(255,127,172,0.22), 0 4px 14px rgba(87,184,255,0.15);
    border: 3px solid #fff;
    position: relative;
  }
  .gate-card::before {
    content: "💌";
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 34px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
  }
  .gate-eyebrow {
    font-family: 'Nunito', sans-serif; font-weight: 700;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-soft); margin: 6px 0 10px; text-align: center;
  }
  .gate-card h2 { font-size: 26px; margin: 0 0 22px; text-align: center; }
  .choice-row, .mcq-row { display: flex; flex-direction: column; gap: 12px; }
  .choice-btn, .mcq-btn {
    font-family: 'Quicksand', sans-serif; font-size: 16px; font-weight: 700;
    padding: 14px 18px; border-radius: 18px; border: 2.5px solid var(--maham-bg);
    background: #fff; color: var(--ink); cursor: pointer;
    text-align: left; transition: transform 0.12s ease, background 0.15s, border-color 0.15s;
  }
  .choice-btn:nth-child(2) { border-color: var(--harris-bg); }
  .choice-btn:hover, .mcq-btn:hover {
    background: linear-gradient(120deg, var(--maham-bg), var(--harris-bg));
    transform: translateY(-2px) scale(1.01);
  }
  .choice-btn:focus-visible, .mcq-btn:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--harris); outline-offset: 2px;
  }
  .gate-msg { margin-top: 16px; font-size: 14px; min-height: 20px; text-align: center; font-weight: 700; }
  .gate-msg.err { color: var(--maham-deep); }
  .gate-back { display: block; margin: 18px auto 0; background: none; border: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; font-family: 'Quicksand', sans-serif; }
  .hidden { display: none !important; }

  /* ---------- HEADER ---------- */
  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 22px 32px; flex-wrap: wrap; gap: 8px;
  }
  header.top .brand { font-size: 22px; }
  header.top .brand span.you { color: var(--harris-deep); }
  #dayStamp {
    font-size: 12px; letter-spacing: 0.06em;
    color: var(--ink); background: #fff;
    padding: 7px 16px; border-radius: 20px;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }

  /* ---------- TODAY SPLIT VIEW ---------- */
  #today-section { padding: 8px 32px 8px; }
  .split {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 0; align-items: stretch; max-width: 980px; margin: 0 auto;
  }
  .seam {
    width: 28px; margin: 0 -1px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .seam::before {
    content: "🤍"; font-size: 20px; z-index: 2;
    background: var(--cream); border-radius: 50%; padding: 4px;
  }
  .side {
    color: var(--ink);
    border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px;
    min-height: 320px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.06);
    border: 3px solid #fff;
  }
  .side.maham { background: var(--maham-bg); }
  .side.harris { background: var(--harris-bg); }
  .side h3 { margin: 0; font-size: 21px; display:flex; align-items:center; gap:8px; }
  .side .role-tag {
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.06em;
    background: #fff; color: var(--ink); padding: 3px 10px; border-radius: 12px;
  }
  .photo-slot {
    flex: 1; border-radius: 20px; overflow: hidden; background: rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center; min-height: 220px;
    position: relative; border: 2px dashed rgba(255,255,255,0.9);
  }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-slot .empty-msg { font-size: 14px; color: var(--ink-soft); text-align: center; padding: 20px; font-weight: 600; }
  .upload-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--ink); color: #fff; border: none; border-radius: 18px;
    padding: 13px 16px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: Quicksand, sans-serif;
    transition: transform 0.12s ease, opacity 0.15s;
  }
  .side.maham .upload-btn { background: var(--maham-deep); }
  .side.harris .upload-btn { background: var(--harris-deep); }
  .upload-btn:hover { transform: translateY(-2px); opacity: 0.92; }
  .upload-btn[disabled] { opacity: 0.5; cursor: default; transform: none; }
  input[type=file] { display: none; }

  /* ---------- ARCHIVE FILM STRIP ---------- */
  #archive-section { padding: 30px 0 60px; }
  #archive-section h2 { font-size: 15px; letter-spacing: 0.04em; padding: 0 32px; color: var(--ink-soft); font-family: 'Nunito', sans-serif; font-weight: 700; }
  .filmstrip {
    display: flex; gap: 18px; overflow-x: auto; padding: 14px 32px 20px;
    scroll-snap-type: x proximity;
  }
  .frame {
    flex: 0 0 auto; width: 210px; scroll-snap-align: start;
    background: #fff; border: 3px solid var(--maham-bg); border-radius: 22px; padding: 12px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.06);
  }
  .frame .frame-date { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; text-align: center; }
  .frame .pair { display: flex; gap: 6px; }
  .frame .pair > div { flex: 1; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #f0eef4; }
  .frame .pair img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- MUSEUM MODE ---------- */
  #museum { padding: 40px 32px 80px; max-width: 1100px; margin: 0 auto; }
  #museum .museum-head { text-align: center; margin-bottom: 40px; }
  #museum .museum-head h1 { font-size: 38px; margin: 0 0 8px; }
  #museum .museum-head p { color: var(--ink-soft); margin: 0; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; }
  .museum-grid { display: flex; flex-direction: column; gap: 20px; }
  .museum-day {
    background: var(--card); color: var(--ink); border-radius: 26px; padding: 18px 20px;
    display: grid; grid-template-columns: 110px 1fr 1fr; gap: 16px; align-items: center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.05); border: 3px solid #fff;
  }
  .museum-day .m-date { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
  .museum-day .m-date .day-no { display:block; font-family:'Baloo 2', cursive; font-size: 26px; color: var(--maham-deep); font-weight: 700;}
  .museum-photo { border-radius: 18px; overflow: hidden; aspect-ratio: 4/3; background: #f0eef4; position: relative; }
  .museum-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .museum-photo .tag { position: absolute; top: 8px; left: 8px; font-family:'Nunito',sans-serif; font-weight: 700; font-size: 10px; background: rgba(255,255,255,0.85); color: var(--ink); padding: 3px 9px; border-radius: 10px; }
  .museum-photo.empty { display:flex; align-items:center; justify-content:center; font-size: 12px; color: var(--ink-soft); font-weight: 600; }

  #countdown-card { max-width: 440px; margin: 60px auto; background: var(--card); color: var(--ink); border-radius: 28px; padding: 34px; text-align: center; box-shadow: 0 14px 30px rgba(0,0,0,0.06); border: 3px solid #fff; }

  footer.signoff { text-align: center; padding: 24px; color: var(--ink-soft); font-size: 12px; font-family: 'Nunito', sans-serif; font-weight: 700; }

  @media (max-width: 720px) {
    .split { grid-template-columns: 1fr; }
    .seam { width: 100%; height: 28px; }
    .museum-day { grid-template-columns: 1fr; }
    .museum-day .m-date { display:flex; align-items:baseline; gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ IDENTITY GATE ============ -->
  <div id="gate">
    <div class="gate-card">
      <div class="gate-eyebrow">✨ Day check-in ✨</div>

      <div id="step-who">
        <h2>Are you Maham or Harris?</h2>
        <div class="choice-row">
          <button class="choice-btn" data-person="maham">I'm Maham</button>
          <button class="choice-btn" data-person="harris">I'm Harris</button>
        </div>
      </div>

      <div id="step-mcq" class="hidden">
        <h2 id="mcq-question"></h2>
        <div class="mcq-row" id="mcq-options"></div>
        <button class="gate-back" id="mcq-back">← wait, that's not me</button>
      </div>

      <div class="gate-msg" id="gate-msg"></div>
    </div>
  </div>

  <!-- ============ MAIN (shown once identity confirmed) ============ -->
  <div id="main" class="hidden">
    <header class="top">
      <div class="brand display">Maham <span class="mono" style="opacity:.6;">💗</span> Harris <span class="mono" style="font-size:13px;opacity:.6;">— one photo a day</span></div>
      <div id="dayStamp" class="mono"></div>
    </header>

    <div id="today-section"></div>
    <div id="archive-section"></div>
    <div id="museum" class="hidden"></div>
    <div id="countdown-card" class="hidden"></div>

    <footer class="signoff">a two-person photo diary · day 1 = July 31, 2026 · museum mode after day 30</footer>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, getDocs, collection, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

// ---------- Firebase ----------
const firebaseConfig = {
  apiKey: "AIzaSyCXual1cAwgyYcbS-x5G8cOYc31aBrjZUU",
  authDomain: "mahamandharris.firebaseapp.com",
  projectId: "mahamandharris",
  storageBucket: "mahamandharris.firebasestorage.app",
  messagingSenderId: "729716488579",
  appId: "1:729716488579:web:4b403e1180bdb2c1c51eb6",
  measurementId: "G-S3HFBYKSCC"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ---------- Cloudinary ----------
const CLOUD_NAME = "xnpoeyxi";
const UPLOAD_PRESET = "daily_photos";

// ---------- Constants ----------
const START_DATE = new Date(2026, 6, 31); // July 31, 2026 (month is 0-indexed)
const TOTAL_DAYS = 30;

function pad(n) { return String(n).padStart(2, "0"); }
function dateToStr(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayStr() { return dateToStr(new Date()); }
function dayNumberFor(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const start = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  return Math.floor((d - start) / 86400000) + 1;
}
function prettyDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

// ---------- Gate state ----------
let currentPerson = null;
const stepWho = document.getElementById("step-who");
const stepMcq = document.getElementById("step-mcq");
const mcqQuestion = document.getElementById("mcq-question");
const mcqOptions = document.getElementById("mcq-options");
const gateMsg = document.getElementById("gate-msg");
const mcqBack = document.getElementById("mcq-back");

const QUESTIONS = {
  maham: {
    text: "What is Maham's favourite colour?",
    options: ["Pink", "Blue", "Yellow"],
    correct: "Pink"
  },
  harris: {
    text: "Who is Harris's favourite anime character?",
    options: ["Natsuki Subaru", "Ishigami Senku", "Monkey D. Luffy"],
    correct: "Natsuki Subaru"
  }
};

document.querySelectorAll(".choice-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const person = btn.dataset.person;
    showMcq(person);
  });
});

mcqBack.addEventListener("click", () => {
  stepMcq.classList.add("hidden");
  stepWho.classList.remove("hidden");
  gateMsg.textContent = "";
  gateMsg.className = "gate-msg";
});

function showMcq(person) {
  const q = QUESTIONS[person];
  mcqQuestion.textContent = q.text;
  mcqOptions.innerHTML = "";
  q.options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "mcq-btn";
    b.textContent = opt;
    b.addEventListener("click", () => checkAnswer(person, opt));
    mcqOptions.appendChild(b);
  });
  stepWho.classList.add("hidden");
  stepMcq.classList.remove("hidden");
  gateMsg.textContent = "";
  gateMsg.className = "gate-msg";
}

function checkAnswer(person, answer) {
  const q = QUESTIONS[person];
  if (answer === q.correct) {
    currentPerson = person;
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("main").classList.remove("hidden");
    boot();
  } else {
    gateMsg.textContent = "Not quite — try again.";
    gateMsg.className = "gate-msg err";
  }
}

// ---------- Data ----------
async function fetchAllPhotos() {
  const snap = await getDocs(query(collection(db, "photos"), orderBy("date", "asc")));
  const byDate = {};
  snap.forEach(d => {
    const data = d.data();
    byDate[data.date] = byDate[data.date] || {};
    byDate[data.date][data.person] = data.photoUrl;
  });
  return byDate;
}

async function uploadPhoto(file, person, dateStr) {
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method: "POST", body: formData
  });
  if (!res.ok) throw new Error("Cloudinary upload failed");
  const data = await res.json();
  if (!data.secure_url) throw new Error("Cloudinary upload failed");

  const docId = `${dateStr}_${person}`;
  const ref = doc(db, "photos", docId);
  const existing = await getDoc(ref);
  if (existing.exists()) throw new Error("already-uploaded");

  await setDoc(ref, {
    person, date: dateStr, photoUrl: data.secure_url, uploadedAt: serverTimestamp()
  });
}

// ---------- Rendering ----------
const dayStamp = document.getElementById("dayStamp");
const todaySection = document.getElementById("today-section");
const archiveSection = document.getElementById("archive-section");
const museumEl = document.getElementById("museum");
const countdownCard = document.getElementById("countdown-card");

async function boot() {
  const today = todayStr();
  const dayNum = dayNumberFor(today);
  const byDate = await fetchAllPhotos();

  todaySection.innerHTML = "";
  archiveSection.innerHTML = "";
  museumEl.classList.add("hidden");
  countdownCard.classList.add("hidden");

  if (dayNum < 1) {
    renderCountdown(dayNum);
  } else if (dayNum > TOTAL_DAYS) {
    renderMuseum(byDate);
  } else {
    dayStamp.textContent = `Day ${dayNum} of ${TOTAL_DAYS} · ${prettyDate(today)}`;
    renderToday(byDate, today);
    renderArchive(byDate, today);
  }
}

function renderCountdown(dayNum) {
  const daysLeft = 1 - dayNum;
  dayStamp.textContent = "Not started yet";
  countdownCard.classList.remove("hidden");
  countdownCard.innerHTML = `
    <h2 class="display">Not started yet</h2>
    <p>Day one begins <strong>July 31, 2026</strong> — ${daysLeft} day${daysLeft === 1 ? "" : "s"} to go.</p>
  `;
}

function renderToday(byDate, today) {
  const entry = byDate[today] || {};
  const otherPerson = currentPerson === "maham" ? "harris" : "maham";

  todaySection.innerHTML = `
    <div class="split">
      ${sideHtml("maham", entry.maham, today)}
      <div class="seam"></div>
      ${sideHtml("harris", entry.harris, today)}
    </div>
  `;

  // wire up the upload control for whichever side belongs to the logged-in person
  const input = todaySection.querySelector(`#file-${currentPerson}`);
  if (input) {
    input.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const btn = todaySection.querySelector(`#btn-${currentPerson}`);
      btn.disabled = true;
      btn.textContent = "Uploading…";
      try {
        await uploadPhoto(file, currentPerson, today);
        boot();
      } catch (err) {
        if (err.message === "already-uploaded") {
          alert("Looks like today's photo already went up — refreshing.");
          boot();
        } else {
          alert("Upload didn't go through. Mind trying again?");
          btn.disabled = false;
          btn.textContent = "Upload today's photo";
        }
      }
    });
  }
}

function sideHtml(person, photoUrl, today) {
  const label = person === "maham" ? "Maham" : "Harris";
  const isMe = person === currentPerson;
  let slotInner;
  if (photoUrl) {
    slotInner = `<img src="${photoUrl}" alt="${label}'s photo for today" />`;
  } else if (isMe) {
    slotInner = `<div class="empty-msg">Your slot for today is still empty.</div>`;
  } else {
    slotInner = `<div class="empty-msg">Waiting on ${label}…</div>`;
  }

  const uploadControl = (isMe && !photoUrl)
    ? `<label class="upload-btn" id="btn-${person}" for="file-${person}">Upload today's photo</label>
       <input type="file" accept="image/*" id="file-${person}" />`
    : (isMe && photoUrl ? `<div class="upload-btn" style="opacity:.5;">Uploaded for today ✓</div>` : "");

  return `
    <div class="side ${person}">
      <h3>${label} ${isMe ? '<span class="role-tag">you</span>' : ""}</h3>
      <div class="photo-slot">${slotInner}</div>
      ${uploadControl}
    </div>
  `;
}

function renderArchive(byDate, today) {
  const pastDates = Object.keys(byDate).filter(d => d < today).sort().reverse();
  if (pastDates.length === 0) {
    archiveSection.innerHTML = "";
    return;
  }
  archiveSection.innerHTML = `
    <h2>Archive</h2>
    <div class="filmstrip">
      ${pastDates.map(d => `
        <div class="frame">
          <div class="frame-date">Day ${dayNumberFor(d)} · ${prettyDate(d)}</div>
          <div class="pair">
            <div>${byDate[d].maham ? `<img src="${byDate[d].maham}" alt="Maham's photo, ${d}" />` : ""}</div>
            <div>${byDate[d].harris ? `<img src="${byDate[d].harris}" alt="Harris's photo, ${d}" />` : ""}</div>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderMuseum(byDate) {
  dayStamp.textContent = "Museum mode";
  museumEl.classList.remove("hidden");
  const dates = Object.keys(byDate).sort();
  museumEl.innerHTML = `
    <div class="museum-head">
      <h1>The First Thirty Days</h1>
      <p>${dates.length} day${dates.length === 1 ? "" : "s"} on record</p>
    </div>
    <div class="museum-grid">
      ${dates.map(d => `
        <div class="museum-day">
          <div class="m-date"><span class="day-no">${dayNumberFor(d)}</span>${prettyDate(d)}</div>
          ${museumPhoto(byDate[d].maham, "Maham")}
          ${museumPhoto(byDate[d].harris, "Harris")}
        </div>
      `).join("")}
    </div>
  `;
}

function museumPhoto(url, label) {
  if (!url) return `<div class="museum-photo empty">no photo from ${label}</div>`;
  return `<div class="museum-photo"><span class="tag">${label}</span><img src="${url}" alt="${label}'s photo" /></div>`;
}
</script>
</body>
</html>
